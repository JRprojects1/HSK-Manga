<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin — HSK Manga</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23d9683f'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6h5a3 3 0 0 1 3 3v10a2.2 2.2 0 0 0-2.2-2.2H4z'/%3E%3Cpath d='M20 6h-5a3 3 0 0 0-3 3v10a2.2 2.2 0 0 1 2.2-2.2H20z'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin { max-width: 920px; margin: 0 auto; padding: 30px 22px 60px; }
    .admin-head { display: flex; justify-content: space-between; align-items: center; }
    .admin-head h1 { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
    .admin-btn {
      font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--panel); color: var(--text-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 8px 15px;
    }
    .admin-btn:hover { color: var(--accent); border-color: var(--accent); }
    .admin-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .sec-title {
      font-size: 12px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin: 28px 0 10px;
    }
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 17px 19px;
    }
    .stat-label { font-size: 13px; font-weight: 700; color: var(--text-2); }
    .stat-big { font-size: 21px; font-weight: 800; margin-top: 3px; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .bar {
      height: 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 999px; overflow: hidden; margin-top: 10px;
    }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .3s; }

    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .mini-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
    }
    .mini-num { font-size: 20px; font-weight: 800; }
    .mini-label { font-size: 12px; color: var(--text-2); font-weight: 700; margin-top: 2px; }

    .tbl-wrap {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-weight: 800; color: var(--text-2);
      padding: 9px 12px; border-bottom: 1.5px solid var(--border-2);
      white-space: nowrap;
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .errors {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11.5px; color: var(--text-2);
      white-space: pre-wrap; word-break: break-word; line-height: 1.6;
    }
    .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }

    /* token gate */
    .gate { max-width: 380px; margin: 90px auto; text-align: center; }
    .gate .modal-icon { margin: 0 auto 14px; }
    .gate h2 { font-size: 20px; font-weight: 800; }
    .gate p { font-size: 13.5px; color: var(--text-2); margin: 7px 0 18px; }
    .gate input { width: 100%; margin-bottom: 12px; }
    .gate-error { color: var(--error); font-size: 13px; font-weight: 700; margin-top: 10px; }
    .top-bar .brand { text-decoration: none; color: var(--text); }
  </style>
</head>
<body>
<script>
  var t = localStorage.getItem('theme');
  if (t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches))
    document.body.classList.add('dark');
</script>

<header class="top-bar">
  <a class="brand" href="/" aria-label="HSK Manga home">
    <span class="brand-mark">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </span>
    <span class="brand-name">HSK Manga · Admin</span>
  </a>
</header>

<!-- Token gate -->
<div class="gate" id="gate" style="display:none">
  <div class="modal-icon">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2>Admin</h2>
  <p>Enter your admin token to view the dashboard.</p>
  <input type="password" id="gate-token" class="text-input" placeholder="Admin token" autocomplete="off">
  <button class="btn-primary" id="gate-submit" type="button">Unlock</button>
  <div class="gate-error hidden" id="gate-error"></div>
</div>

<!-- Dashboard -->
<main class="admin" id="dashboard" style="display:none">
  <div class="admin-head">
    <div>
      <h1>Dashboard</h1>
      <div class="admin-meta" id="generated-at"></div>
    </div>
    <button class="admin-btn" id="refresh-btn" type="button">↻ Refresh</button>
  </div>

  <div class="sec-title">Today</div>
  <div class="card-row">
    <div class="stat-card">
      <div class="stat-label">LLM spend</div>
      <div class="stat-big" id="spend-big">—</div>
      <div class="bar"><div class="bar-fill" id="spend-bar"></div></div>
      <div class="stat-sub" id="spend-sub"></div>
    </div>
  </div>

  <div class="sec-title">Recent chapters</div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>When</th><th>Chapter</th><th class="num">Pages</th>
        <th>Avg size</th><th>Tokens c / i / o</th><th class="num">Est. cost</th>
      </tr></thead>
      <tbody id="chapters-body"></tbody>
    </table>
  </div>

  <div class="sec-title">Recent errors</div>
  <div class="errors" id="errors-box"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = 'adminToken';

  const fmtNum = (n) => (typeof n === 'number' ? n.toLocaleString() : '—');
  const fmtUsd = (n) => (typeof n === 'number' ? '$' + n.toFixed(n < 1 ? 4 : 2) : '—');
  const kTok = (n) => (typeof n === 'number' ? (n / 1000).toFixed(1) + 'k' : '—');
  function fmtWhen(ts) {
    const d = new Date(ts);
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function barColor(pct) {
    if (pct >= 90) return 'var(--error)';
    if (pct >= 75) return 'var(--warn-text)';
    return 'var(--accent)';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function showGate(errorMsg) {
    $('dashboard').style.display = 'none';
    $('gate').style.display = '';
    const e = $('gate-error');
    if (errorMsg) { e.textContent = errorMsg; e.classList.remove('hidden'); }
    else e.classList.add('hidden');
    $('gate-token').focus();
  }

  async function loadStats() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { showGate(); return; }
    try {
      const r = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
      if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); showGate('That token was not accepted.'); return; }
      if (r.status === 503) { showGate('Admin dashboard is not configured on the server (ADMIN_TOKEN unset).'); return; }
      if (!r.ok) { showGate('Could not load stats (HTTP ' + r.status + ').'); return; }
      render(await r.json());
    } catch (e) {
      showGate('Network error loading stats.');
    }
  }

  function render(d) {
    $('gate').style.display = 'none';
    $('dashboard').style.display = '';
    $('generated-at').textContent = 'Updated ' + fmtWhen(d.generatedAt);

    // Spend
    const s = d.spend;
    const sPct = s.capUsd > 0 ? Math.min(100, (s.spentUsd / s.capUsd) * 100) : 0;
    $('spend-big').textContent = fmtUsd(s.spentUsd) + ' / ' + fmtUsd(s.capUsd);
    $('spend-bar').style.width = sPct + '%';
    $('spend-bar').style.background = barColor(sPct);
    $('spend-sub').textContent = sPct.toFixed(0) + '% of daily cap · resets ' + s.date + ' (UTC)';

    // Chapters
    const body = $('chapters-body');
    body.innerHTML = '';
    if (!d.chapters.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No chapters processed yet.</td></tr>';
    } else {
      for (const c of d.chapters) {
        const fw = c.fireworks;
        const tokCell = c.cacheHit ? 'cache hit'
          : fw ? (kTok(fw.cachedInputTokens) + ' / ' + kTok(fw.inputTokens) + ' / ' + kTok(fw.outputTokens))
          : '—';
        const size = (c.avgPageWidth && c.avgPageHeight) ? (c.avgPageWidth + '×' + c.avgPageHeight) : '—';
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + escapeHtml(fmtWhen(c.ts)) + '</td>' +
          '<td>' + escapeHtml(c.title || '—') + '</td>' +
          '<td class="num">' + fmtNum(c.pages) + '</td>' +
          '<td>' + size + '</td>' +
          '<td>' + tokCell + '</td>' +
          '<td class="num">' + (c.costUsd != null ? fmtUsd(c.costUsd) : '—') + '</td>';
        body.appendChild(tr);
      }
    }

    // Errors
    $('errors-box').textContent = d.recentErrors.length
      ? d.recentErrors.join('\n')
      : 'No errors logged.';
  }

  $('gate-submit').addEventListener('click', () => {
    const v = $('gate-token').value.trim();
    if (!v) return;
    localStorage.setItem(TOKEN_KEY, v);
    loadStats();
  });
  $('gate-token').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('gate-submit').click(); });
  $('refresh-btn').addEventListener('click', loadStats);

  loadStats();
</script>

</body>
</html>
